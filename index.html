
  <!DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />

      <!-- ─── Preconnects — reduce font latency ─── -->
      <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

      <!-- ─── Preload critical fonts ─── -->
      <link
        rel="preload"
        href="/fonts/gt-ultra-median-bold.woff2"
        as="font"
        type="font/woff2"
        crossorigin
      />
      <link rel="preload" href="/fonts/manrope-600.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="/fonts/manrope-700.woff2" as="font" type="font/woff2" crossorigin />

      <!-- ─── Satoshi (body fallback font, weight 400 only — the only weight used) ───
           Loaded as non-render-blocking CSS: fetched with low priority via the
           media="print" trick, then swapped to "all" once loaded, so it never
           delays first paint of the self-hosted critical fonts above. -->
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&display=swap"
        media="print"
        onload="this.media='all'"
      />
      <noscript>
        <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,700&display=swap" />
      </noscript>

      <!-- ─── Primary SEO ─── -->
      <title>Digio - Transformation is our code_</title>
      <meta name="description" content="Somos un factor de cambio e impulso al servicio de las soluciones digitales más sólidas. Desde 2007 creamos software y productos digitales para startups y compañías de todos los tamaños." />
      <link rel="canonical" href="https://digio.es" />
      <link rel="alternate" hreflang="es" href="https://digio.es" />
      <link rel="alternate" hreflang="en" href="https://digio.es" />
      <link rel="alternate" hreflang="x-default" href="https://digio.es" />

      <!-- ─── Open Graph ─── -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Digio" />
      <meta property="og:title" content="Digio - Transformation is our code_" />
      <meta property="og:description" content="Somos un factor de cambio e impulso al servicio de las soluciones digitales más sólidas. Desde 2007 creamos software y productos digitales para startups y compañías de todos los tamaños." />
      <meta property="og:url" content="https://digio.es" />
      <meta property="og:image" content="https://digio.es/og-image.jpg" />

      <!-- ─── Twitter Card ─── -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Digio - Transformation is our code_" />
      <meta name="twitter:description" content="Somos un factor de cambio e impulso al servicio de las soluciones digitales más sólidas. Desde 2007 creamos software y productos digitales para startups y compañías de todos los tamaños." />
      <meta name="twitter:image" content="https://digio.es/og-image.jpg" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
